name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web app
        run: |
          npm install --legacy-peer-deps
          npx vite build

      - name: Setup Capacitor, Icons & Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.supermoney.app",
            "appName": "Super Money",
            "webDir": "dist",
            "android": {
              "adjustMarginsForEdgeToEdge": "force",
              "backgroundColor": "#071126"
            }
          }
          EOF
          npx cap add android
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Money-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
